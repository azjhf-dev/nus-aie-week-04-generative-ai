      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

", "name": "_"}], "metadata": {"marimo_version": "0.25.2"}, "version": "1"},
            "session": {"cells": [{"code_hash": "2cab78099bd636427406100deebd3495", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9b165af562983bd9f3ff0338a6845b5a", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "950ab0254c9de140014c864e9dc1de1c", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8287e55358ebd8138ea3c58531fe22a6", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"week-4-generative-models-and-sampling\"\u003EWeek 4: Generative models and sampling\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EA full week of self-study, mapped to \u003Cstrong\u003EGenerative AI and its Applications\u003C/strong\u003E. Estimated \u003Cstrong\u003E16 active hours\u003C/strong\u003E, not an official contact-hour claim.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIndependent reconstruction, not NUS-issued teaching material.\u003C/strong\u003E Published objectives are the anchor. Exercises, datasets and rubric are original.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EStudy reconstruction and a nonlinear autoencoder\u003C/li\u003E\n\u003Cli\u003EExplore forward noise and denoising assumptions\u003C/li\u003E\n\u003Cli\u003ECompare masked-token and autoregressive objectives and sampling temperature\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.comp.nus.edu.sg/executive-education/course/sctp-generative-ai-and-its-applications/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EOfficial objectives\u003C/a\u003E | \u003Ca href=\"https://github.com/azjhf-dev/nus-aie-week-04-generative-ai\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERepository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBoundary:\u003C/strong\u003E Toy denoising is not Stable Diffusion. Sampling from a small fixed vocabulary is not GPT; no pretrained BERT/GPT or multimodal model inference is bundled. The official named model families need the documented optional extensions.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "09076b67430708f16bbdd440b23ec917", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"plan-your-week\"\u003EPlan your week\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDay 1: reconstruction and autoencoding (3h)\u003C/li\u003E\n\u003Cli\u003EDay 2: latent controls and denoising (3h)\u003C/li\u003E\n\u003Cli\u003EDay 3: token probabilities and text objectives (3h)\u003C/li\u003E\n\u003Cli\u003EDay 4: multimodal alignment and responsible use (3h)\u003C/li\u003E\n\u003Cli\u003EDay 5: gallery, evaluation and limitations (4h)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EStart each lab by predicting the effect of a control. Change one variable, record the observation, then explain why. All default experiments need no key, no paid service and no private data. The hosted WASM viewer needs an internet connection to fetch its runtime and packages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7dcf544d6e13bfb4f59f9c13e86467e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='0c11787e-22a2-6724-5c7e-45873cb99670'\u003E\u003Cmarimo-checkbox data-initial-value='true' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003ePlay conceptual motion graphic\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-disabled='false d80a35eda36f5f59b68efe9f69ebf5bd", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"01-train-a-real-small-autoencoder\"\u003E01 | Train a real small autoencoder\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA tanh encoder and linear decoder reconstruct a four-feature signal. Both matrices are trained by gradient descent. This is a small autoencoder, not a variational autoencoder or an image-generation foundation model.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1f8836371c32b0d1f993178a9ffe3cd1", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='BYtC-0' random-id='b1d906e4-9e20-0ae5-643a-c59ca4d66ef8'\u003E\u003Cmarimo-slider data-initial-value='300' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eAutoencoder epochs\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='20' data-stop='800' data-step='20' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='BYtC-1' random-id='e35a5f39-ca9a-3ea5-3adf-c4c0925d7006'\u003E\u003Cmarimo-slider data-initial-value='2' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u n class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eIs the moving average a diffusion model?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eIs low temperature a factuality control?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eBuild task\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENo. It lacks a trained denoiser/score model, conditioning, a reverse diffusion schedule and a generative sampling process.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENo. It concentrates a distribution but cannot make unsupported claims true.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ERun a licensed pretrained text or image model locally if hardware allows; record model/version/license, seed, settings, outputs and a structured failure analysis. Do not buy compute.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "1327ac4e4fa8e66898098930cbf1c8f2", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown pro
